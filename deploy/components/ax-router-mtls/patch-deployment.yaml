apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchboard
spec:
  template:
    spec:
      containers:
        - name: switchboard
          volumeMounts:
            # ax.DefaultCredentialBundleFile: the key, then the chain.
            - name: podidentity
              mountPath: /run/podidentity.podcert.ate.dev
              readOnly: true
            # ax.DefaultTrustBundleFile.
            - name: servicedns-ca
              mountPath: /run/servicedns-ca
              readOnly: true
      volumes:
        # The pod's certificate, for the pod's ServiceAccount:
        # spiffe://cluster.local/ns/<namespace>/sa/<serviceaccount>. The
        # kubelet rewrites it before it expires (24h at most, refreshed half an
        # hour ahead), and switchboard re-reads it.
        - name: podidentity
          projected:
            sources:
              - podCertificate:
                  signerName: podidentity.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        # The roots the router's certificate (for atenet-router.ate-system.svc)
        # chains to; only the live bundle, not one being canaried.
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
