apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchboard
spec:
  template:
    spec:
      # The volume is mounted for the nonroot user the pod runs as; fsGroup
      # makes a freshly provisioned volume writable by it.
      securityContext:
        fsGroup: 65532
      containers:
        - name: switchboard
          env:
            - name: SWITCHBOARD_STATE_DIR
              value: /var/lib/switchboard
          volumeMounts:
            - name: state
              mountPath: /var/lib/switchboard
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: switchboard-state
