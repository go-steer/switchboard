# Durable routing state (#86): a restart re-attaches every thread to the
# session it had, instead of starting it over and leaking the old session on
# the daemon. Opt-in, because it needs a PersistentVolumeClaim and so a
# StorageClass the cluster may not have. Add it to an overlay:
#
#   components:
#     - ../../components/durable-state
#
# The one setting it makes is through the environment rather than the
# config file, against the base's rule, because it is not a choice an
# operator edits: it is where this component mounts the volume, and the two
# have to agree. Setting state_dir in config.json as well is harmless only
# if it names the same path — the variable outranks the file.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - pvc.yaml

patches:
  - path: patch-deployment.yaml
