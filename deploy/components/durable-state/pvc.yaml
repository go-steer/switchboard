# The routing table is one small JSON file — a few hundred bytes per
# conversation — so the smallest volume a provisioner will hand out is
# plenty. ReadWriteOnce, because the file has exactly one writer: the
# Deployment stays at one replica (see base/51-deployment.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: switchboard-state
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
