# KSA for switchboard. switchboard is a transport-only chat gateway: it
# talks to the local core-agent daemon over pod networking and to a chat
# platform's API over the internet. It reads NOTHING from the Kubernetes
# API, so — unlike the k8s-lookout sentinel — it needs no ClusterRole and
# no cluster RBAC at all.
#
# The plain SA here suits the Slack overlay (Socket Mode needs no cloud
# IAM). The Google Chat overlay patches on a Workload Identity annotation
# so this KSA impersonates a GSA holding Pub/Sub subscriber + the Chat bot
# scope (ADC) — see overlays/googlechat.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
    app.kubernetes.io/component: gateway
