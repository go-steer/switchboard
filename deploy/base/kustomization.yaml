# Platform-neutral base. Not applyable on its own — build a platform
# overlay instead (see overlays/slack, overlays/googlechat). The
# namespace and image tag are set here so both overlays inherit one
# source of truth; override newTag with a released :vX.Y.Z in production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-triage

resources:
  - 11-serviceaccount.yaml
  - 16-networkpolicy.yaml
  - 51-deployment.yaml

images:
  - name: ghcr.io/go-steer/switchboard
    newTag: main
