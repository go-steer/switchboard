# Slack deployment of switchboard:
#
#   kubectl apply -k "github.com/go-steer/switchboard/deploy/overlays/slack?ref=main"
#
# Prerequisites this overlay references but does NOT create (see
# deploy/README.md):
#   - the agent-triage namespace
#   - Secret switchboard-daemon-token (key: token)  — core-agent bearer
#   - Secret switchboard-slack (keys: app-token, bot-token) — Slack creds
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: switchboard
