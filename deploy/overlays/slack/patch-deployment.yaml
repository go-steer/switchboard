# Slack overlay: append the Slack platform flags to the base args list
# and mount the two Slack tokens from a Secret. JSON 6902 `add` with a
# `-` index appends to the existing lists rather than replacing them, so
# the base's --daemon-url / --token-env / --progress-mode survive.
#
# Slack Socket Mode is a pure outbound WebSocket — no Workload Identity,
# no cloud IAM — so the base ServiceAccount is used unchanged.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--platform=slack"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--caller-id=email"
# App-level (Socket Mode) token, xapp-…
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SWITCHBOARD_SLACK_APP_TOKEN
    valueFrom:
      secretKeyRef:
        name: switchboard-slack
        key: app-token
# Bot user OAuth token, xoxb-…
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SWITCHBOARD_SLACK_BOT_TOKEN
    valueFrom:
      secretKeyRef:
        name: switchboard-slack
        key: bot-token
