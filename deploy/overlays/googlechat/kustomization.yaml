# Google Chat deployment of switchboard. Because the project id,
# subscription id, and GSA email are deployment-specific, this overlay is
# a starting point you fork and edit (patch-deployment.yaml,
# patch-serviceaccount.yaml) rather than apply verbatim:
#
#   # after editing PROJECT_ID / SUBSCRIPTION_ID:
#   kubectl apply -k deploy/overlays/googlechat
#
# Prerequisites this overlay references but does NOT create (see
# deploy/README.md):
#   - the agent-triage namespace
#   - Secret switchboard-daemon-token (key: token) — core-agent bearer
#   - a GSA with roles/pubsub.subscriber + the Chat app identity, bound
#     to this KSA via Workload Identity (patch-serviceaccount.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patch-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: switchboard
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: switchboard
