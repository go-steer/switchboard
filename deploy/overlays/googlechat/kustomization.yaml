# Google Chat deployment of switchboard. Because the project id,
# subscription id, and GSA email are deployment-specific, this overlay is
# a starting point you fork and edit (config.json,
# patch-serviceaccount.yaml) rather than apply verbatim:
#
#   # after editing PROJECT_ID / SUBSCRIPTION_ID in config.json:
#   kubectl apply -k deploy/overlays/googlechat
#
# Prerequisites this overlay references but does NOT create (see
# deploy/README.md):
#   - the agent-triage namespace
#   - Secret switchboard-daemon-token (key: token) — core-agent bearer
#   - a GSA with roles/pubsub.subscriber + the Chat app identity, bound
#     to this KSA via Workload Identity (patch-serviceaccount.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set here rather than in the base, because the ConfigMap below is
# generated at this level and would otherwise land in `default` while
# the Deployment went elsewhere — see base/kustomization.yaml.
namespace: agent-triage

resources:
  - ../../base

# The settings, as a file rather than as flags: the base's argv is
# --config alone, because a flag would outrank the same setting here and
# an edit to this file would then do nothing (#71). This is where
# PROJECT_ID, SUBSCRIPTION_ID and the app-command ids go. There is no
# longer a Deployment patch — every arg it used to append is a key in
# config.json, and only the ServiceAccount still needs patching.
#
# Generated rather than hand-written so the name carries a content hash.
# switchboard reads the file once at startup, so a ConfigMap edited in
# place changes nothing until something else restarts the pod; the hash
# makes the Deployment roll when — and only when — the config changes.
configMapGenerator:
  - name: switchboard-config
    files:
      - config.json

patches:
  - path: patch-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: switchboard
