# Bind the switchboard KSA to a Google service account via Workload
# Identity so ADC resolves in-cluster. The GSA must hold roles/
# pubsub.subscriber on the events subscription and be configured as the
# Chat app's service account (Chat bot scope). No JSON key is mounted —
# WI is keyless.
#
# EDIT the GSA email; then bind the KSA (one-time, out-of-band):
#   gcloud iam service-accounts add-iam-policy-binding \
#     switchboard@PROJECT_ID.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:PROJECT_ID.svc.id.goog[agent-triage/switchboard]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchboard
  annotations:
    iam.gke.io/gcp-service-account: switchboard@PROJECT_ID.iam.gserviceaccount.com
