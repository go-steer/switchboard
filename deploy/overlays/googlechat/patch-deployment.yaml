# Google Chat overlay: append the Google Chat platform flags to the base
# args list. Credentials are NOT env/secrets here — ingress (Pub/Sub
# subscribe) and egress (Chat REST, bot scope) both authenticate via
# Application Default Credentials, which resolve through the Workload
# Identity annotation this overlay adds to the ServiceAccount.
#
# EDIT the project id, subscription id, and app-command mapping below for
# your deployment. The command ids are the numeric ids assigned in the Chat
# API console — Chat identifies a command by id, never by name.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--platform=googlechat"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--google-project=PROJECT_ID"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--google-subscription=SUBSCRIPTION_ID"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--googlechat-commands=1=progress"
# Card rendering: "status" (default, gateway messages only), "rich" (also lay
# agent replies out as cards), or "off". Text is always sent as the fallback.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--googlechat-cards=status"
# Asserted-caller form, stated explicitly because the daemon has to have it
# provisioned: "email" from the event payload (same as the Slack overlay, so
# one human is one identity across both), or "id" for the raw users/NNN
# resource name. An event with no email falls back to the resource name.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--caller-id=email"
