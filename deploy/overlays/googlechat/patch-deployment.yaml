# Google Chat overlay: append the Google Chat platform flags to the base
# args list. Credentials are NOT env/secrets here — ingress (Pub/Sub
# subscribe) and egress (Chat REST, bot scope) both authenticate via
# Application Default Credentials, which resolve through the Workload
# Identity annotation this overlay adds to the ServiceAccount.
#
# EDIT the project id and subscription id below for your deployment.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--platform=googlechat"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--google-project=PROJECT_ID"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--google-subscription=SUBSCRIPTION_ID"
