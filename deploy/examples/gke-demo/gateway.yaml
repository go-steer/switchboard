# The Chat app's interaction endpoint: https://switchboard-chat.demo.gke.ninja/chat.
#
# The certificate is not a Kubernetes object: it is the Certificate Manager
# map star-demo-gke-ninja (*.demo.gke.ninja), attached by annotation. The
# address is a reserved global static IP, so the DNS record outlives the
# Gateway being recreated.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: switchboard-chat
  annotations:
    networking.gke.io/certmap: star-demo-gke-ninja
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
  addresses:
    - type: NamedAddress
      value: switchboard-chat-ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: switchboard-chat
spec:
  parentRefs:
    - name: switchboard-chat
  hostnames:
    - switchboard-chat.demo.gke.ninja
  rules:
    - matches:
        - path:
            type: Exact
            value: /chat
      backendRefs:
        - name: switchboard-chat
          port: 8081
---
# The endpoint answers only signed POSTs, so the load balancer health-checks
# the metrics listener's /healthz instead.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: switchboard-chat
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 9090
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: switchboard-chat
