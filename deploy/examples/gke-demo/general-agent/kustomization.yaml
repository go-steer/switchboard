# A small general-purpose core-agent on Gemini's cheap tier, registered with
# both gateways as the "general" agent next to the platform agent (#140). No
# cluster tools, ask-mode approvals, a short persona; its own service account
# with only Vertex access.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: general-agent-content
    files:
      - config.json
      - AGENTS.md
  - name: general-agent-gcp-env
    literals:
      - GOOGLE_CLOUD_PROJECT=gke-demos-345619
      - GOOGLE_CLOUD_LOCATION=global
images:
  - name: ghcr.io/go-steer/core-agent
    newTag: main
