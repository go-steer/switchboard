# The content (config.json, AGENTS.md) comes from a ConfigMap laid out as an
# agent tree: --agents-dir is /opt/general/.agents, so the persona at
# /opt/general/AGENTS.md is the project root's, as in the platform agent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: general-agent
  labels:
    app.kubernetes.io/name: general-agent
    app.kubernetes.io/component: daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: general-agent
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: general-agent
        app.kubernetes.io/component: daemon
    spec:
      serviceAccountName: general-agent
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: core-agent
          image: ghcr.io/go-steer/core-agent:main
          imagePullPolicy: Always
          args:
            - "-c"
            - "/opt/general/.agents/config.json"
            - "--agents-dir=/opt/general/.agents"
            - "--no-repl"
            - "--session-db"
            - "--session-db-path=/var/lib/core-agent/session.db"
          envFrom:
            - configMapRef:
                name: general-agent-gcp-env
          ports:
            - name: attach
              containerPort: 7777
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: content
              mountPath: /opt/general
              readOnly: true
            - name: users
              mountPath: /etc/core-agent
              readOnly: true
            - name: session-db
              mountPath: /var/lib/core-agent
          readinessProbe:
            httpGet:
              path: /healthz
              port: attach
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: attach
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: content
          configMap:
            name: general-agent-content
            items:
              - key: config.json
                path: .agents/config.json
              - key: AGENTS.md
                path: AGENTS.md
        - name: users
          secret:
            secretName: general-agent-users
            defaultMode: 0440
        - name: session-db
          persistentVolumeClaim:
            claimName: general-agent-session-db
