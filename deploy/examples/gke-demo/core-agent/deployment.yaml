# The gke-platform-agent daemon, as core-agent's examples/gke-platform-agent
# deploys it, with the config swapped for the ConfigMap above. --agents-dir
# keeps the content image as the agents directory, so AGENTS.md (its parent),
# the MCP config and the cluster subagent (root ../cluster) resolve exactly
# as they do in the stock deployment. The agents directory is read-only, so
# an "always allow" answer cannot persist; it lasts the session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-agent
  labels:
    app.kubernetes.io/name: core-agent
    app.kubernetes.io/component: daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: core-agent
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-agent
        app.kubernetes.io/component: daemon
    spec:
      serviceAccountName: core-agent-daemon
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: core-agent
          image: ghcr.io/go-steer/core-agent:main
          imagePullPolicy: Always
          args:
            - "-c"
            - "/etc/core-agent-config/config.switchboard.json"
            - "--agents-dir=/opt/gke-platform-agent/.agents"
            - "--no-repl"
            - "--session-db"
            - "--session-db-path=/var/lib/core-agent/session.db"
          envFrom:
            - configMapRef:
                name: core-agent-gcp-env
          ports:
            - name: attach
              containerPort: 7777
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: recipe-content
              mountPath: /opt/gke-platform-agent
              readOnly: true
            - name: plans
              mountPath: /opt/gke-platform-agent/.agents/plans
            - name: config
              mountPath: /etc/core-agent-config
              readOnly: true
            - name: users
              mountPath: /etc/core-agent
              readOnly: true
            - name: session-db
              mountPath: /var/lib/core-agent
          readinessProbe:
            httpGet:
              path: /healthz
              port: attach
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: attach
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: recipe-content
          image:
            reference: us-central1-docker.pkg.dev/gke-demos-345619/core-agent-recipes/gke-platform-agent-content:v4
            pullPolicy: IfNotPresent
        - name: config
          configMap:
            name: core-agent-config
        - name: users
          secret:
            secretName: core-agent-users
            defaultMode: 0440
        - name: plans
          emptyDir:
            sizeLimit: 10Mi
        - name: session-db
          persistentVolumeClaim:
            claimName: core-agent-session-db
