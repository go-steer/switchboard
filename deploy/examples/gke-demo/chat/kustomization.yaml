apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -chat
resources:
  - ../../../base
  - service.yaml
components:
  - ../../../components/durable-state
labels:
  # Two gateways from one base: the instance label keeps their selectors,
  # Services and NetworkPolicies apart.
  - pairs:
      app.kubernetes.io/instance: chat
    includeSelectors: true
images:
  # switchboard tracks main, as core-agent does here: fixes land without
  # waiting for a release. Pin a main-<sha> tag to hold a build.
  - name: ghcr.io/go-steer/switchboard
    newTag: main
configMapGenerator:
  - name: switchboard-config
    files:
      - config.json
patches:
  - path: patch-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: switchboard
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: switchboard
  - path: patch-networkpolicy.yaml
    target:
      kind: NetworkPolicy
      name: switchboard
  - path: patch-pull-always.yaml
    target:
      kind: Deployment
      name: switchboard
