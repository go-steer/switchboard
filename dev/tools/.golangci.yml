# golangci-lint v2 config for switchboard.
#
# Conservative starting set: keeps the noise low while catching real bugs.
# Add stricter linters (revive, depguard, exhaustruct, etc.) once the
# baseline is clean and we have a feel for what's worth enforcing.
#
# Run with:   dev/tools/lint-go
# Auto-fix:   dev/tools/lint-go --fix

version: "2"

run:
  relative-path-mode: gomod
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Bug-finders we never want to silence.
    - errcheck       # unchecked errors
    - govet          # core vet rules
    - ineffassign    # ineffectual assignments
    - staticcheck    # massive bug+style ruleset (now includes stylecheck + gosimple)
    - unused         # dead code

    # Quality-of-life.
    - misspell       # common typos in identifiers/comments
    - unconvert      # unnecessary type conversions
    - unparam        # unused function parameters
    - gocritic       # opinionated extra rules; many useful, low false-positive

    # Compliance.
    - goheader       # enforces the Apache 2.0 boilerplate on every .go file

    # Security.
    - gosec          # OWASP-style checks (nosec via // #nosec)

    # Complexity ratchet. Thresholds are pinned to today's measured in-tree
    # maximum so existing code passes untouched and only functions worse than
    # today's ceiling fail; cmd/switchboard/architecture_test.go additionally
    # caps the count of non-test functions over 150 lines (2).
    - funlen
    - gocognit

  exclusions:
    # Generated code shouldn't fail the lint.
    generated: lax
    # Git worktrees under .claude/ or .worktrees/ hold other branches' work in progress.
    paths:
      - (^|/)\.claude/
      - (^|/)\.worktrees/
    presets:
      - common-false-positives
      - legacy
    rules:
      # Tests can be looser about errcheck (eg. defer f.Close()) and
      # have permission to use weak random / hardcoded creds.
      - path: _test\.go
        linters:
          - errcheck
          - funlen
          - gocognit
          - gosec
          - unparam
      # Pre-existing best-effort teardown / fire-and-forget calls in untouched files.
      - path: ^(cmd/switchboard/(main|router)|pkg/chat/(googlechat/googlechat|slack/slack))\.go$
        linters:
          - errcheck
        text: "Error return value of `(audit\\.close|r\\.surfaceNotice|ps\\.Close|a\\.sm\\.Ack)` is not checked"
      # Operator-supplied --config path and secret-redaction regex pattern.
      - path: ^cmd/switchboard/config\.go$
        linters:
          - gosec
        text: "G703:"
      - path: ^pkg/daemon/client\.go$
        linters:
          - gosec
        text: "G101:"
      # Wire-frame structs are intentionally converted via explicit literals so
      # wire changes never silently couple to public types; Pub/Sub v1 migration
      # and intentional CLI/Substrate error strings are tracked separately.
      - path: ^pkg/(approval/wire|daemon/client)\.go$
        linters:
          - staticcheck
        text: "S1016:"
      - path: ^pkg/chat/googlechat/
        linters:
          - staticcheck
        text: 'SA1019:.*"cloud\.google\.com/go/pubsub"'
      - path: ^(cmd/switchboard/admin|pkg/ax/ax)\.go$
        linters:
          - staticcheck
        text: "ST1005:"
      - path: ^(cmd/switchboard/(binding|router_test|state)|pkg/chat/slack/mrkdwn)\.go$
        linters:
          - staticcheck
        text: "QF100[16]:"
      # Pre-existing helper signatures in untouched router/registry files.
      - path: ^cmd/switchboard/(registry|router)\.go$
        linters:
          - unparam
        text: "(agentEntry|toolLine|tickRender)"
      - path: ^cmd/switchboard/(router|card_router_test)\.go$
        linters:
          - unused
        text: "func (finalLine|\\(\\*cardFake\\)\\.editCount) is unused"

  settings:
    errcheck:
      # Noise patterns where checking the error has no useful action:
      # writing to stderr for a diagnostic, closing a file/body in defer,
      # or best-effort cleanup of a temp file. The `_ =` boilerplate
      # is worse than the missed check here.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (*os.File).Close
        - (io.ReadCloser).Close
        - os.Remove
    # --- Complexity ratchet (measured 2026-11-20) -------------------
    #   funlen lines       715   cmd/switchboard/main.go `runServe`
    #   funlen statements  408   cmd/switchboard/main.go `runServe`
    #   gocognit           197   cmd/switchboard/main.go `runServe`
    #   funcs > 150 lines    2   capped in cmd/switchboard/architecture_test.go
    # Ratchet DOWN as hotspots get refactored — never up.
    funlen:
      lines: 715
      statements: 408
      ignore-comments: true
    gocognit:
      min-complexity: 197
    gocritic:
      disabled-checks:
        # "ifElseChain" pushes us toward switch statements that aren't
        # always clearer; let the author choose.
        - ifElseChain
        # commentFormatting is noisy for // TODO style markers.
        - commentFormatting
    gosec:
      excludes:
        # G104 (errcheck) is already covered by errcheck linter.
        - G104
    goheader:
      # Enforced on every .go file. {{ YEAR-RANGE }} accepts a single
      # year or a range (e.g. "2026" or "2026-2027"); files added in
      # 2026 say "2026" and stale ones can be bumped to "2026-2027" on
      # first edit. Keep in sync with the LICENSE appendix.
      template: |-
        Copyright {{ YEAR-RANGE }} Google LLC

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

formatters:
  enable:
    - gofmt          # canonical formatting
    - goimports      # import grouping + missing imports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/go-steer/switchboard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
