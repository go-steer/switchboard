# release-images publishes the distroless multicall image to GHCR on a
# semver tag. It is the release counterpart to ci.yml: ci gates every PR,
# this ships the artifact once a `v*` tag is pushed. The multi-stage
# Dockerfile is already buildx-ready (BUILDPLATFORM builder + TARGETOS/
# TARGETARCH), so both linux/amd64 and linux/arm64 come off one build.
# Build identity (VERSION/COMMIT/BUILD_DATE) is injected as build args and
# ends up in `switchboard version`.
name: release-images

on:
  push:
    tags: ["v*"]
  # Manual trigger for a dry run: builds the image but never pushes.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For build provenance / SBOM attestations pushed alongside the image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Only authenticate to GHCR for a real tag push; a workflow_dispatch
      # run stays a no-push dry run.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Derive tags from the semver git tag: full version, major.minor,
      # major, plus `latest` for a non-prerelease. A prerelease tag
      # (v1.2.3-rc1) publishes only its exact version, never moving latest.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          # Supply-chain posture to match the distroless base: ship a
          # max-detail provenance attestation and an SBOM with the image.
          provenance: mode=max
          sbom: true

      # A signed attestation binding the pushed digest to this workflow run,
      # verifiable with `gh attestation verify`.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
