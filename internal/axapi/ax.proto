syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/go-steer/switchboard/internal/axapi";

// AX defines the core control plane gRPC service for autonomous agent orchestration.
service AX {
  // Manifests are parsed by the client (see `ax apply`) and submitted through the
  // typed Update* RPCs below; the server never receives raw YAML.

  // Tasks
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc SuspendTask(SuspendTaskRequest) returns (Task);
  rpc ResumeTask(ResumeTaskRequest) returns (Task);


  // Workspaces
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Models
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc UpdateModel(UpdateModelRequest) returns (Model);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

}

// ObjectMeta is metadata for AX resources.
message ObjectMeta {
  string name = 1;
  string atespace = 2;
  google.protobuf.Timestamp create_time = 3;
}

// --- Task ---

message Task {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  TaskSpec spec = 4;
  TaskStatus status = 5;
}

message TaskSpec {
  string image = 1;
  repeated string command = 2;
  repeated EnvVar env = 3;
  ResourcesSpec resources = 4;
  // workspace binds the Workspace the task works in. It is mounted at
  // /workspace unless the binding sets a path, and that path is the task
  // command's working directory. A task without a workspace gets an empty
  // working directory at /workspace.
  WorkspaceRef workspace = 5;
  // debug enables the in-container guest services (process execution and file
  // access) that back `ax ssh`. Off by default.
  bool debug = 6;
  // config is free-form, runner-defined configuration. AX stores it and
  // hands it to the runner as-is, as part of the Task in AX_TASK_YAML and
  // the task metadata endpoint. The control plane only checks that it is an
  // object within MaxTaskConfigSize; it does not validate or interpret it.
  // It is stored in plain text and shown by `ax get task`, so it must not
  // hold secrets.
  google.protobuf.Struct config = 7;
  // Fields 100 and up are this fork's own (mastersingh24/ax, see FORK.md).
  // Upstream numbers TaskSpec fields from 1 upward, so the fork starts at 100
  // and an upstream addition can never take one of its numbers again.

  // egress lists the outbound destinations the task may reach. Agent Substrate
  // denies an actor's outbound traffic unless its egress policy allows it, so a
  // task without egress rules has no network beyond DNS.
  repeated EgressRule egress = 100;
  // http forwards requests that reach the task through Agent Substrate's
  // router to a server inside the task. The router only reaches the runner's
  // port, so this is how a task serves its own API (an agent's session API,
  // A2A, MCP, a webhook) to callers outside the sandbox.
  TaskHTTP http = 101;
  // idle suspends the task automatically once it has been idle for a while,
  // so a request-driven agent gives its worker back between requests. Agent
  // Substrate's router resumes a suspended task on its next request.
  TaskIdle idle = 102;
  // on_completion says what happens when spec.command exits: "Keep" (the
  // default) leaves the task running so it stays inspectable, "Suspend"
  // suspends it.
  string on_completion = 103;
}

// TaskIdle configures automatic suspension of an idle task. A task is idle
// when no request has gone through the runner's pass-through (spec.http.port)
// for suspend_after and, if busy_path is set, the task does not report itself
// busy.
message TaskIdle {
  // suspend_after is how long the task must be idle before it is suspended,
  // as a Go duration such as "10m" or "90s".
  string suspend_after = 1;
  // busy_path is an HTTP path on spec.http.port that reports whether the
  // agent is in the middle of work with no request open, for example a long
  // investigation started by a request that has already been answered. It
  // must answer 200 with a JSON body {"busy": true} while busy; any other
  // answer, including errors and timeouts, means not busy.
  string busy_path = 2;
}

// TaskHTTP configures the runner's pass-through to a server inside the task.
message TaskHTTP {
  // port is the local port the task's server listens on. Requests for paths
  // the runner serves itself (/healthz, /readyz, /metadata/v1alpha1/ax/status) are not
  // forwarded.
  int32 port = 1;
}

// EgressRule allows HTTPS to a set of hosts and ports, and optionally has the
// egress gateway inject credentials into matching requests.
message EgressRule {
  // hosts are DNS names, or a DNS name with "*" as its leftmost label.
  repeated string hosts = 1;
  // ports defaults to 443 when empty.
  repeated int32 ports = 2;
  // credentials are injected by the egress gateway, so the task never holds
  // them. The task sends each header with a placeholder value.
  repeated CredentialInjection credentials = 3;
}

// CredentialInjection replaces a request header with a credential resolved by
// the egress gateway's credential provider.
message CredentialInjection {
  // header is the request header to replace, e.g. "x-goog-api-key".
  string header = 1;
  // prefix is prepended to the credential verbatim, e.g. "Bearer ".
  string prefix = 2;
  // credential_uri names the credential for the provider, e.g.
  // "ate-secret://k8s.io/default/<namespace>/<secret>/<key>".
  string credential_uri = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message ResourcesSpec {
  ResourceList requests = 1;
  ResourceList limits = 2;
}

message ResourceList {
  string cpu = 1;
  string memory = 2;
}

message WorkspaceRef {
  string name = 1;
  string path = 2;
}

message TaskStatus {
  string phase = 1;
  string id = 2;
  string actor = 3;
  // json_name keeps the established `workerIP` spelling in YAML and JSON.
  string worker_ip = 4 [json_name = "workerIP"];
  repeated Condition conditions = 7;
}

message Condition {
  string type = 1;
  string status = 2;
  google.protobuf.Timestamp update_time = 3;
  string reason = 4;
  string message = 5;
}

// --- Workspace ---

message Workspace {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkspaceSpec spec = 4;
}

message WorkspaceSpec {
  repeated GitRepo git = 1;
  repeated File files = 2;
  MCPConfig mcp = 3;
  SkillsConfig skills = 4;
}

message GitRepo {
  string name = 1;
  string repo = 2;
  string branch = 3;
  string dir = 4;
  int32 depth = 5;
}

message File {
  string path = 1;
  string content = 2;
}

message MCPConfig {
  repeated MCPRegistry registries = 1;
  repeated MCPServer servers = 2;
}

message MCPRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
  repeated MCPServer servers = 4;
}

message MCPServer {
  string name = 1;
  string endpoint = 2;
  string command = 3;
  repeated string args = 4;
}

message SkillsConfig {
  repeated SkillRegistry registries = 1;
  string path = 2;
}

message SkillRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
}

// --- Model ---

message Model {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ModelSpec spec = 4;
}

message ModelSpec {
  string provider = 1;
  string model = 2;
  SecretKeyRef secret_key = 3;
  // parameters are provider-specific generation settings passed through to the
  // model API as-is, for example temperature or maxOutputTokens for Gemini.
  google.protobuf.Struct parameters = 4;
}

message SecretKeyRef {
  string name = 1;
  string key = 2;
}

// --- RPC Request & Response Messages ---

// Tasks
message GetTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ListTasksRequest {
  string atespace = 1;
  int64 limit = 2;
  int64 offset = 3;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  Task task = 1;
}

message DeleteTaskRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteTaskResponse {}

message SuspendTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ResumeTaskRequest {
  string atespace = 1;
  string name = 2;
}

// Workspaces
message GetWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message ListWorkspacesRequest {
  string atespace = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteWorkspaceResponse {}

// Models
message GetModelRequest {
  string atespace = 1;
  string name = 2;
}

message ListModelsRequest {
  string atespace = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message UpdateModelRequest {
  Model model = 1;
}

message DeleteModelRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteModelResponse {}

